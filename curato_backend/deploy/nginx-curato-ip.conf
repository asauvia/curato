# Curato stack on a single VPS (replace IP or add server_name when you attach a domain).
# Install: sudo cp nginx-curato-ip.conf /etc/nginx/sites-available/curato
#          sudo ln -sf /etc/nginx/sites-available/curato /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Web roots expected (see install-vps.sh):
#   /var/www/curato/ecom/    — curato-ecom Flutter web (shop at /)
#   /var/www/curato/admin/   — curato-admin Flutter web
#   /var/www/curato/vendor/  — curato-vendor Flutter web

upstream curato_node {
    server 127.0.0.1:5001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name 72.61.172.182;

    client_max_body_size 100M;

    # API (Express + JSON)
    location /api/ {
        proxy_pass http://curato_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO (same Node process as server.js)
    location /socket.io/ {
        proxy_pass http://curato_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Admin panel (Flutter web)
    location /admin/ {
        root /var/www/curato;
        try_files $uri $uri/ /admin/index.html;
    }

    # Vendor panel (Flutter web)
    location /vendor/ {
        root /var/www/curato;
        try_files $uri $uri/ /vendor/index.html;
    }

    # Technical SEO: Robots.txt with text/plain
    location = /robots.txt {
        root /var/www/curato/ecom;
        default_type text/plain;
        access_log off;
        log_not_found off;
    }

    # Technical SEO: Sitemap.xml with application/xml
    location = /sitemap.xml {
        root /var/www/curato/ecom;
        default_type application/xml;
        access_log off;
        log_not_found off;
    }

    # Storefront (Flutter web)
    location / {
        root /var/www/curato/ecom;
        try_files $uri $uri/ /index.html;
    }
}

